# =====================================================================
# n8n self-host untuk Manajemen Stok Sayur
# ---------------------------------------------------------------------
#   cp .env.example .env   → isi nilainya → docker compose up -d
#   Panel: http://localhost:5678
#
# Untuk produksi, taruh di belakang reverse proxy ber-HTTPS
# (Caddy / Nginx / Traefik) dan set WEBHOOK_URL ke domain publik Anda.
# =====================================================================

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-stok-sayur
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # ── Variabel khusus workflow ini ──────────────────────────────
      - STOK_PIN=${STOK_PIN}
      - STOK_SESSION_MINUTES=${STOK_SESSION_MINUTES:-60}

      # ── Jaringan & webhook ────────────────────────────────────────
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}

      # ── Zona waktu ────────────────────────────────────────────────
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Jakarta}
      - TZ=${TZ:-Asia/Jakarta}

      # ── Keamanan ──────────────────────────────────────────────────
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # ── Node Code perlu akses process.env untuk membaca STOK_PIN ──
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow tersedia di dalam container untuk kemudahan import
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
